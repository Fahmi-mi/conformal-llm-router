services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_ALPHA_DEFAULT: ${GATEWAY_ALPHA_DEFAULT:-0.10}
      GATEWAY_LAMBDA_DEFAULT: ${GATEWAY_LAMBDA_DEFAULT:-0.45}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      ORIGIN: http://localhost:3000
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8000}
    depends_on:
      - gateway
