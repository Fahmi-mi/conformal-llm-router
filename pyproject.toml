[project]
name = "conformal-llm-router"
version = "0.1.0"
description = "Conformal Hallucination Control & Learned LLM Cost-Quality Router"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.2.0",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mapie>=1.6.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
